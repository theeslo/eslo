<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESLO — My Timeline</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');


/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}


/* =========================
   BODY
========================= */

body {
    font-family: "Vazirmatn", sans-serif;
    background: #05070b;
    color: #fff;
    overflow-x: hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;

    width: 500px;
    height: 500px;

    background: #2563eb;

    filter: blur(180px);
    opacity: .12;

    top: -150px;
    left: -150px;

    pointer-events: none;

    z-index: -1;
}


body::after {
    content: "";
    position: fixed;

    width: 450px;
    height: 450px;

    background: #7c3aed;

    filter: blur(180px);
    opacity: .08;

    bottom: -150px;
    right: -150px;

    pointer-events: none;

    z-index: -1;
}


/* =========================
   NAVBAR
========================= */

nav {
    position: fixed;

    top: 0;
    width: 100%;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background: rgba(5, 7, 11, .65);

    backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255, 255, 255, .06);

    z-index: 100;
}


/* LOGO */

.logo {
    display: flex;
    align-items: center;

    text-decoration: none;
}


.logo img {
    width: 38px;
    height: 38px;

    object-fit: contain;

    display: block;
}


/* NAV LINKS */

nav a {
    color: #aaa;

    text-decoration: none;

    margin-right: 25px;

    font-size: 14px;

    transition: .3s;
}


nav a:hover {
    color: #fff;
}


/* =========================
   HERO
========================= */

.hero {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 100px 20px;
}


.hero-content {
    max-width: 800px;
}


/* BADGE */

.badge {

    display: inline-block;

    padding: 8px 15px;

    border: 1px solid rgba(96, 165, 250, .3);

    border-radius: 50px;

    color: #60a5fa;

    background: rgba(96, 165, 250, .06);

    font-size: 13px;

    margin-bottom: 25px;
}


/* HERO TITLE */

.hero h1 {

    font-size: clamp(70px, 18vw, 150px);

    line-height: .9;

    letter-spacing: 12px;

    font-weight: 800;

    background: linear-gradient(
        135deg,
        #fff,
        #64748b
    );

    -webkit-background-clip: text;

    color: transparent;
}


.hero
