<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eslo | My Timeline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      line-height: 1.8;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at top, #172554, transparent 45%),
        #080b12;
    }

    .hero h1 {
      font-size: 70px;
      margin: 0;
      letter-spacing: 5px;
    }

    .hero p {
      color: #9ca3af;
      font-size: 20px;
    }

    .timeline {
      max-width: 800px;
      margin: auto;
      padding: 80px 25px;
    }

    .timeline h2 {
      text-align: center;
      font-size: 35px;
      margin-bottom: 60px;
    }

    .event {
      position: relative;
      padding: 25px;
      margin: 30px 0;
      border: 1px solid #263248;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
    }

    .year {
      color: #60a5fa;
      font-size: 24px;
      font-weight: bold;
    }

    .event h3 {
      margin: 5px 0;
      font-size: 22px;
    }

    .event p {
      color: #aab2c0;
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 48px;
      }

      .hero p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="hero">
      <h1>ESLO</h1>
      <p>My story. My timeline.</p>
    </div>
  </header>

  <main class="timeline">

    <h2>مسیر من</h2>

    <div class="event">
      <div class="year">2024</div>
      <h3>شروع مسیر</h3>
      <p>اینجا می‌تونیم اولین اتفاق مهم زندگی یا فعالیتت رو بنویسیم.</p>
    </div>

    <div class="event">
      <div class="year">2025</div>
      <h3>یک قدم جدید</h3>
      <p>اتفاقات، پروژه‌ها و دستاوردهای این سال.</p>
    </div>

    <div class="event">
      <div class="year">2026</div>
      <h3>ادامه مسیر</h3>
      <p>اینجا داستان سال 2026 تو قرار می‌گیره.</p>
    </div>

  </main>

  <footer>
    © 2026 ESLO
  </footer>

</body>
                                 </html>
