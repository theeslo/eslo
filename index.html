<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESLO — My Timeline</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

body {
  font-family: "Vazirmatn", sans-serif;
  background: #05070b;
  color: #fff;
  overflow-x: hidden;
}

/* BACKGROUND */

body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  background: #2563eb;
  filter: blur(180px);
  opacity: .12;
  top: -150px;
  left: -150px;
  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  width: 450px;
  height: 450px;
  background: #7c3aed;
  filter: blur(180px);
  opacity: .08;
  bottom: -150px;
  right: -150px;
  pointer-events: none;
}

/* NAVBAR */

nav {
  position: fixed;
  top: 0;
  width: 100%;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7%;
  background: rgba(5,7,11,.65);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,.06);
  z-index: 100;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 4px;
}

nav a {
  color: #aaa;
  text-decoration: none;
  margin-right: 25px;
  font-size: 14px;
  transition: .3s;
}

nav a:hover {
  color: #fff;
}

/* HERO */

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 20px;
}

.hero-content {
  max-width: 800px;
}

.badge {
  display: inline-block;
  padding: 8px 15px;
  border: 1px solid rgba(96,165,250,.3);
  border-radius: 50px;
  color: #60a5fa;
  background: rgba(96,165,250,.06);
  font-size: 13px;
  margin-bottom: 25px;
}

.hero h1 {
  font-size: clamp(70px, 18vw, 150px);
  line-height: .9;
  letter-spacing: 12px;
  font-weight: 800;
  background: linear-gradient(135deg,#fff,#64748b);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  margin-top: 30px;
  color: #8b95a7;
  font-size: 17px;
}

/* BUTTON */

.button {
  display: inline-block;
  margin-top: 35px;
  padding: 13px 25px;
  border-radius: 12px;
  background: #fff;
  color: #05070b;
  text-decoration: none;
  font-weight: 700;
  transition: .3s;
}

.button:hover {
  transform: translateY(-3px);
}

/* SECTION */

section {
  padding: 100px 7%;
}

.section-title {
  text-align: center;
  margin-bottom: 70px;
}

.section-title span {
  color: #60a5fa;
  font-size: 13px;
}

.section-title h2 {
  margin-top: 10px;
  font-size: 38px;
}

/* YEAR NAVIGATION */

.years {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 70px;
}

.year-btn {
  border: 1px solid #202938;
  background: #0b0f17;
  color: #8b95a7;
  padding: 10px 18px;
  border-radius: 50px;
  cursor: pointer;
  transition: .3s;
  font-family: inherit;
}

.year-btn:hover,
.year-btn.active {
  background: #fff;
  color: #05070b;
}

/* TIMELINE */

.timeline {
  position: relative;
  max-width: 850px;
  margin: auto;
}

.timeline::before {
  content: "";
  position: absolute;
  width: 2px;
  background: linear-gradient(#2563eb,transparent);
  top: 0;
  bottom: 0;
  right: 50%;
}

.event {
  position: relative;
  width: 50%;
  padding: 15px 35px;
  margin-bottom: 30px;
}
